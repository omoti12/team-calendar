<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>現場管理</title>
  <meta name="theme-color" content="#1f4e8c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="現場管理">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css?v=23">
</head>
<body>
  <header class="app-header">
    <nav class="crumbs">
      <button id="backBtn" class="crumb-root">現場一覧</button>
      <span id="crumbSep" class="crumb-sep" hidden>›</span>
      <h1 id="pageTitle" hidden></h1>
    </nav>
    <span id="syncStatus" class="sync-status" role="status" hidden></span>
    <button id="menuBtn" class="icon-btn" aria-label="メニュー">⋯</button>
  </header>

  <div id="menu" class="menu" hidden>
    <button id="pushBtn">通知をオンにする</button>
    <button id="installBtn">ホーム画面に追加</button>
    <button id="logoutBtn">合言葉を入れ直す</button>
    <button id="exportBtn">データを書き出す (JSON)</button>
    <label class="menu-file">データを読み込む
      <input id="importInput" type="file" accept="application/json" hidden>
    </label>
    <button id="printBtn">印刷</button>
  </div>

  <!-- 合言葉の入力（クラウド共有） -->
  <main id="passView" class="pass-view" hidden>
    <img class="pass-icon" src="icons/icon-192.png" alt="" width="80" height="80">
    <h1>現場管理</h1>
    <p class="pass-lead">チームの合言葉を入れてください。<br>同じ合言葉を入れた人どうしで、同じ現場データが見られます。</p>
    <form id="passForm" class="pass-form">
      <label for="passInput">合言葉</label>
      <input id="passInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例：はなこ工務店2026" required>
      <button type="submit">はじめる</button>
    </form>
    <p class="pass-note">はじめて使う時は、ここで決めた言葉がチームの合言葉になります。他の人には同じ言葉を伝えてください。合言葉を知っている人は誰でも見たり書き換えたりできるので、推測されにくい言葉にしてください。</p>
  </main>

  <!-- 現場一覧 -->
  <main id="listView">
    <div class="search-row">
      <input id="searchInput" type="search" placeholder="現場名で検索" autocomplete="off">
    </div>
    <div class="filter-row">
      <span id="countText" class="count-text"></span>
      <button class="chip active" data-filter="all">すべて</button>
      <button class="chip" data-filter="open">未完了あり</button>
      <button class="chip" data-filter="done">すべて完了</button>
      <button class="chip chip-warn" data-filter="warn">⚠️ 期限注意</button>
    </div>
    <form id="addSiteForm" class="add-site">
      <fieldset class="template-picker">
        <legend>項目セット</legend>
        <div id="templatePicker" class="template-options"></div>
      </fieldset>
      <div class="add-site-row">
        <input id="newSiteName" type="text" placeholder="新しい現場名を入力" aria-label="現場名" required>
        <input id="newSiteOwner" class="owner-input" type="text" placeholder="担当者" aria-label="担当者（作った人）" autocomplete="name">
        <button type="submit">＋ 追加</button>
      </div>
    </form>
    <p id="cloudError" class="cloud-error" role="alert" hidden></p>
    <div id="pushBanner" class="push-banner" hidden>
      <span>🔔 期限の2週間前のお昼に、スマホへ通知を送れます</span>
      <span class="push-banner-actions">
        <button id="pushBannerOn" class="push-on">通知をオンにする</button>
        <button id="pushBannerLater" class="push-later">あとで</button>
      </span>
    </div>
    <p id="cloudLoading" class="cloud-loading" hidden>チームのデータを読み込み中…</p>
    <ul id="siteList" class="folder-grid"></ul>
    <p id="emptyMsg" class="empty" hidden></p>
  </main>

  <!-- 現場詳細 -->
  <main id="detailView" hidden>
    <div class="sheet">
    <div class="site-meta">
      <span id="siteArea" class="site-area" hidden></span>
      <input id="siteNameInput" class="site-name" type="text" aria-label="現場名">
      <div class="work-date">
        <label for="ownerInput">担当者</label>
        <input id="ownerInput" class="owner-field" type="text" placeholder="名前を入力">
      </div>
      <div class="work-date">
        <label for="workDateInput">工事実行日</label>
        <input id="workDateInput" type="date">
        <span id="workDateLeft" class="work-left"></span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
      <p id="progressText" class="progress-text"></p>
      <p id="alertBanner" class="alert-banner" role="status" hidden></p>
    </div>

    <table class="checklist">
      <thead>
        <tr><th>項目</th><th class="col-date">期限</th><th class="col-qty">台数・人数</th><th class="col-status">状態</th><th class="col-del"></th></tr>
      </thead>
      <tbody id="taskBody"></tbody>
    </table>

    <button id="addTaskBtn" class="add-task">＋ 項目を追加</button>

    <!-- 現場資料（写真をフォルダで整理） -->
    <section id="docsSection" class="docs" aria-labelledby="docsRoot">
      <div class="docs-head">
        <h2 class="docs-title">
          <button id="docsRoot" type="button" class="docs-crumb">📁 現場資料</button>
          <span id="docsCrumbSep" class="docs-sep" hidden>›</span>
          <span id="docsFolderName" class="docs-folder-name"></span>
        </h2>
        <span id="docsCount" class="docs-count"></span>
      </div>
      <p id="docsLocalNote" class="docs-note" hidden>写真は、チームの合言葉を入れて共有している時に使えます。</p>
      <div id="docsBody">
        <div id="docsToolbar" class="docs-toolbar">
          <label class="docs-btn is-primary">＋ 写真を追加<input id="photoInput" type="file" accept="image/*" multiple hidden></label>
          <button id="newFolderBtn" type="button" class="docs-btn">＋ フォルダを作る</button>
          <button id="renameFolderBtn" type="button" class="docs-btn" hidden>名前を変更</button>
          <button id="deleteFolderBtn" type="button" class="docs-btn is-danger" hidden>フォルダを削除</button>
          <button id="selectBtn" type="button" class="docs-btn">選択</button>
        </div>
        <div id="selectBar" class="select-bar" hidden>
          <span id="selectCount" class="select-count"></span>
          <div class="select-actions">
            <button id="toFolderBtn" type="button" class="docs-btn is-primary">フォルダに入れる</button>
            <button id="unfileBtn" type="button" class="docs-btn" hidden>フォルダから出す</button>
            <button id="deletePhotosBtn" type="button" class="docs-btn is-danger">削除</button>
            <button id="cancelSelectBtn" type="button" class="docs-btn">やめる</button>
          </div>
        </div>
        <p id="uploadStatus" class="upload-status" role="status" hidden></p>
        <div id="docsGrid" class="docs-grid"></div>
        <p id="docsEmpty" class="docs-empty" hidden></p>
      </div>
    </section>

    <label class="notes-label" for="siteNotes">メモ</label>
    <textarea id="siteNotes" rows="4" placeholder="自由に記入"></textarea>
    </div>

    <button id="deleteSiteBtn" class="danger">この現場を削除</button>

    <div class="action-bar">
      <button id="backToListBtn" class="btn-back">‹ 現場一覧に戻る</button>
      <span id="saveStatus" class="save-status" role="status"></span>
      <button id="saveBtn" class="btn-save">保存</button>
    </div>
  </main>

  <!-- 完了・保存の時に画面の真ん中に出すお知らせ -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <div class="toast-card">
      <div class="toast-icon" aria-hidden="true">✓</div>
      <p id="toastTitle" class="toast-title"></p>
      <p id="toastText" class="toast-text"></p>
    </div>
  </div>

  <!-- 写真を大きく見る -->
  <div id="photoViewer" class="photo-viewer" role="dialog" aria-modal="true" aria-label="写真" hidden>
    <div class="viewer-top">
      <span id="viewerCaption" class="viewer-caption"></span>
      <button id="viewerClose" type="button" class="viewer-btn" aria-label="閉じる">✕</button>
    </div>
    <div class="viewer-stage">
      <button id="viewerPrev" type="button" class="viewer-nav" aria-label="前の写真">‹</button>
      <img id="viewerImg" class="viewer-img" alt="">
      <button id="viewerNext" type="button" class="viewer-nav" aria-label="次の写真">›</button>
    </div>
    <div class="viewer-bottom">
      <button id="viewerMove" type="button" class="viewer-btn">フォルダに入れる</button>
      <button id="viewerDelete" type="button" class="viewer-btn is-danger">削除</button>
    </div>
  </div>

  <!-- フォルダ名の入力 -->
  <div id="nameDialog" class="dialog-backdrop" hidden>
    <form id="nameDialogForm" class="dialog" role="dialog" aria-modal="true" aria-labelledby="nameDialogMsg">
      <p id="nameDialogMsg"></p>
      <input id="nameDialogInput" class="name-input" type="text" maxlength="40" autocomplete="off" required>
      <div class="dialog-actions">
        <button id="nameDialogCancel" type="button" class="btn-sub">キャンセル</button>
        <button type="submit" class="btn-main">決定</button>
      </div>
    </form>
  </div>

  <!-- 入れ先のフォルダを選ぶ -->
  <div id="folderSheet" class="dialog-backdrop" hidden>
    <div class="dialog folder-sheet" role="dialog" aria-modal="true" aria-labelledby="folderSheetTitle">
      <p id="folderSheetTitle">どのフォルダに入れますか？</p>
      <div id="folderSheetList" class="folder-list"></div>
      <div class="dialog-actions">
        <button id="folderSheetCancel" type="button" class="btn-sub">やめる</button>
      </div>
    </div>
  </div>

  <div id="dialog" class="dialog-backdrop" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true">
      <p id="dialogMsg"></p>
      <div class="dialog-actions">
        <button id="dialogCancel" class="btn-sub">キャンセル</button>
        <button id="dialogOk" class="btn-main">OK</button>
      </div>
    </div>
  </div>

  <template id="taskRow">
    <tr>
      <td class="col-title"><textarea class="task-title" rows="1" placeholder="項目を入力"></textarea>
          <input class="task-note" type="text" placeholder="＋ 備考を書く">
          <span class="task-warn" hidden></span></td>
      <td class="col-date" data-label="期限"><input class="task-date" type="date" aria-label="期限" required></td>
      <td class="col-qty" data-label="台数・人数"><input class="task-qty" type="text" aria-label="台数・人数"></td>
      <td class="col-done" data-label="完了日"><input class="task-done-date" type="date" aria-label="完了日" required></td>
      <td class="col-status"><button class="status-btn" type="button"></button></td>
      <td class="col-del"><button class="del-btn" aria-label="項目を削除">×</button></td>
    </tr>
  </template>

  <script src="vendor/firebase-10.14.1/firebase-app-compat.js"></script>
  <script src="vendor/firebase-10.14.1/firebase-firestore-compat.js"></script>
  <script src="cloud.js?v=23"></script>
  <script src="docs.js?v=23"></script>
  <script src="app.js?v=23"></script>
</body>
</html>
